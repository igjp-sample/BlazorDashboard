name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # Checkout the code
    - uses: actions/checkout@v6

    # Install .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Install .NET WebAssembly Tools
      run: dotnet workload install wasm-tools

    # Setup NuGet package source
    - name: Setup NuGet package source
      run: dotnet nuget add source "https://packages.infragistics.com/nuget/licensed" 
        -n Infragistics 
        -u api 
        -p ${{ secrets.ACCESSTOKEN_FOR_NUGET }}
        --store-password-in-clear-text

    - name: Publish
      run: dotnet publish BlazorDashboard/BlazorDashboard.csproj -p:GHPages=true -o:public

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: public/wwwroot
        force_orphan: true
